# Preset Konfigurasi Optimal ARMSX2 untuk Nintendo Switch Tegra X1
# Letakkan file ini di sdmc:/switch/armsx2/inis/PCSX2.ini

[EmuCore]
EnableWideScreenPatches = true
EnableNoInterlacingPatches = true

[EmuCore/CPU]
FPU.OverFlow = true
VU0.OverFlow = true
VU1.OverFlow = true

[EmuCore/CPU/Recompiler]
EnableEE = true
EnableIOP = true
EnableVU0 = true
EnableVU1 = true
EnableFastmem = false
EnableVUAot = true

[EmuCore/Speedhacks]
WaitLoop = true
IntcStat = true
vuFlagHack = true
vuThread = true
EECycleRate = -1
EECycleSkip = 0

[EmuCore/GS]
Renderer = 13
VsyncEnable = 0
FrameSkip = 1
AspectRatio = Auto 4:3/16:9
UpscaleMultiplier = 1

[SPU2/Output]
Backend = SDL
Latency = 60
SynchMode = 0

[UI]
StartBigPictureMode = true
