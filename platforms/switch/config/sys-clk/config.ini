# sys-clk Overclock Configuration for ARMSX2 on Nintendo Switch
# Salin bagian ini ke sdmc:/config/sys-clk/config.ini

[0100A64000582000]
# Title ID Forwarder ARMSX2 (0100A64000582000)

# Mode Docked (TV / HDMI Out)
docked_cpu = 1785
docked_gpu = 768
docked_mem = 1600

# Mode Handheld (Layar Switch)
handheld_cpu = 1785
handheld_gpu = 460
handheld_mem = 1600

# Mode Pengisian Daya Resmi / USB-PD
charging_cpu = 1963
charging_gpu = 768
charging_mem = 1600
